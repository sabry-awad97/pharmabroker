# Air - Live reload for Go apps
# https://github.com/cosmtrek/air

root = "."
tmp_dir = "tmp"

[build]
# Command to build the application
cmd = "go build -o ./tmp/main ./cmd/whatsapp"
# Binary to run
bin = "./tmp/main"
# Watch these extensions
include_ext = ["go", "tpl", "tmpl", "html"]
# Exclude these directories
exclude_dir = ["tmp", "vendor", "bin"]
# Exclude files matching these patterns
exclude_file = []
# Exclude regex patterns
exclude_regex = ["_test.go"]
# Exclude unchanged files
exclude_unchanged = false
# Follow symlinks
follow_symlink = false
# Log file (empty = no log file)
log = ""
# Delay before reloading (ms)
delay = 1000
# Stop running old binary before building
stop_on_error = true
# Send interrupt signal before kill
send_interrupt = true
# Kill delay (ms)
kill_delay = 500

[log]
# Log time
time = true

[color]
# Colors for different log types
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true

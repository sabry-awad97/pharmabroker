name: pharmabroker

# ═══════════════════════════════════════════════════════════════════════════════
#  Port Allocation Strategy
# ═══════════════════════════════════════════════════════════════════════════════
#  Service         │ Internal │ External │ Notes
#  ────────────────┼──────────┼──────────┼────────────────────────────────────────
#  PostgreSQL      │ 5432     │ 5432     │ Database
#  API (Bun/Hono)  │ 3000     │ 3000     │ Main API gateway
#  WhatsApp (Go)   │ 8080     │ -        │ Internal only (via Docker network)
#  Web (Vite)      │ 5173     │ 5173     │ Frontend dev server (run locally)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 🗄️ PostgreSQL + pgvector
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: pharmabroker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmabroker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - '5432:5432'
    volumes:
      - ./pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pharmabroker

  # ─────────────────────────────────────────────────────────────────────────────
  # ⚡ API Server (Bun/Hono) - Development with hot reload
  # ─────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pharmabroker-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-pharmabroker}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-super-secret-key-change-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      WHATSAPP_SERVICE_URL: http://whatsapp:8080
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./packages
          target: /app/packages
        - action: sync+restart
          path: ./apps/server/src
          target: /app/apps/server/src
    restart: unless-stopped
    networks:
      - pharmabroker

  # ─────────────────────────────────────────────────────────────────────────────
  # ⚡ API Server (Bun/Hono) - Production build
  # ─────────────────────────────────────────────────────────────────────────────
  api-prod:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pharmabroker-api-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-pharmabroker}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-super-secret-key-change-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      WHATSAPP_SERVICE_URL: http://whatsapp:8080
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pharmabroker
    profiles:
      - prod

  # ─────────────────────────────────────────────────────────────────────────────
  # 📱 WhatsApp Service (Go) - Development with Air hot reload
  # ─────────────────────────────────────────────────────────────────────────────
  whatsapp-dev:
    image: cosmtrek/air:latest
    container_name: pharmabroker-whatsapp
    working_dir: /app
    environment:
      # Server configuration
      WHATSAPP_SERVER_HOST: 0.0.0.0
      WHATSAPP_SERVER_PORT: 8080
      # WhatsApp client configuration
      WHATSAPP_DB_PATH: /data/whatsmeow.db
      WHATSAPP_QR_TIMEOUT: 2m
      WHATSAPP_RECONNECT_DELAY: 5s
      WHATSAPP_MAX_RECONNECTS: 10
      WHATSAPP_MESSAGE_RATE_LIMIT: 30
      # WebSocket configuration for API server connection
      WHATSAPP_WEBSOCKET_URL: ws://api:3000/ws/whatsapp
      WHATSAPP_WEBSOCKET_PING_INTERVAL: 30s
      WHATSAPP_WEBSOCKET_PONG_TIMEOUT: 10s
      WHATSAPP_WEBSOCKET_RECONNECT_DELAY: 5s
      WHATSAPP_WEBSOCKET_MAX_RECONNECTS: 0
      WHATSAPP_WEBSOCKET_QUEUE_SIZE: 1000
      # Logging configuration
      WHATSAPP_LOG_LEVEL: debug
      WHATSAPP_LOG_FORMAT: text
    expose:
      - '8080'
    volumes:
      - ./service/whatsapp:/app
      - whatsapp_data_dev:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      pharmabroker:
        aliases:
          - whatsapp

  # ─────────────────────────────────────────────────────────────────────────────
  # 📱 WhatsApp Service (Go) - Production build
  # ─────────────────────────────────────────────────────────────────────────────
  whatsapp:
    build:
      context: ./service/whatsapp
      dockerfile: Dockerfile
    container_name: pharmabroker-whatsapp-prod
    environment:
      # Server configuration
      WHATSAPP_SERVER_HOST: 0.0.0.0
      WHATSAPP_SERVER_PORT: 8080
      # WhatsApp client configuration
      WHATSAPP_DB_PATH: /data/whatsmeow.db
      WHATSAPP_QR_TIMEOUT: 2m
      WHATSAPP_RECONNECT_DELAY: 5s
      WHATSAPP_MAX_RECONNECTS: 10
      WHATSAPP_MESSAGE_RATE_LIMIT: 30
      # WebSocket configuration for API server connection
      WHATSAPP_WEBSOCKET_URL: ws://api:3000/ws/whatsapp
      WHATSAPP_WEBSOCKET_PING_INTERVAL: 30s
      WHATSAPP_WEBSOCKET_PONG_TIMEOUT: 10s
      WHATSAPP_WEBSOCKET_RECONNECT_DELAY: 5s
      WHATSAPP_WEBSOCKET_MAX_RECONNECTS: 0
      WHATSAPP_WEBSOCKET_QUEUE_SIZE: 1000
      # Logging configuration
      WHATSAPP_LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-info}
      WHATSAPP_LOG_FORMAT: ${WHATSAPP_LOG_FORMAT:-json}
    expose:
      - '8080'
    volumes:
      - whatsapp_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:8080/health',
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pharmabroker
    profiles:
      - prod

# ═══════════════════════════════════════════════════════════════════════════════
#  Networks
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  pharmabroker:
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════════
#  Volumes
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  whatsapp_data:
    driver: local
  whatsapp_data_dev:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
#  AI Models (Docker Model Runner)
# ═══════════════════════════════════════════════════════════════════════════════
models:
  qwen:
    model: ai/qwen3-vl:latest
    context_size: 32768

  ministral:
    model: ai/ministral3:latest
    context_size: 32768

  gemma:
    model: ai/gemma3:latest
    context_size: 32768

  embedding:
    model: ai/embeddinggemma:latest
    context_size: 32768
